# Fgwebsite_cc Workflow Add Or Update Seasonal Data

## Action

Follow the add-or-update-seasonal-data workflow:
1. Add or update JSON data files for the new season in public/data or data/ directories.
2. Update or create scripts in scripts/ to process or build the new data.
3. Modify or extend src/components/ and src/pages/ to use or display the new data.
4. Update src/lib/ modules to handle new data structure or calculations if needed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: public/data/boxscores/YYYY.json, public/data/roster-age/YYYY.json, data/player-bio.json

